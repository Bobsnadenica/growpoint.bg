title = "GrowPoint gitleaks config"

# Start from gitleaks' built-in rule set (AWS keys, private keys, generic
# high-entropy tokens, provider secrets, etc.).
[extend]
useDefault = true

[allowlist]
description = "Vendored dependencies and scanner definitions only"
# Documentation, templates, public client config and generated builds must be scanned.
# Confirmed false positives below are scoped to one rule and exact safe content.
paths = [
  '''backend/api/node_modules/''',
  '''\.gitleaks\.toml$''',
  '''scripts/check-secrets\.sh$''',
]

[[rules]]
id = "hashicorp-tf-password"
[[rules.allowlists]]
description = "Cognito authentication-flow enum, not a Terraform password"
condition = "AND"
paths = ['''(^|/)infra/terraform/main\.tf$''']
regexTarget = "secret"
regexes = ['''^\s*"?ALLOW_(USER_PASSWORD|USER_SRP|REFRESH_TOKEN)_AUTH"?,?\s*$''']

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Exact historical launch-readiness prose, not an API credential"
condition = "AND"
paths = ['''(^|/)docs/dsk-sandbox-preflight-2026-10-01\.md$''']
regexTarget = "secret"
regexes = ['''^refunds/cancellation$''']
