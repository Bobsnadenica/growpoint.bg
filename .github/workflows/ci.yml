name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan the pushed / PR commit range.
          fetch-depth: 0

      - name: Project secret guard (no tracked secrets)
        run: bash scripts/check-secrets.sh

      - name: gitleaks (generic secret detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  build:
    name: Build & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs the dark-theme guard, `tsc --noEmit`, and the Vite production build.
      - name: Build (theme guard + tsc + vite)
        run: npm run build

      - name: Backend syntax check
        run: node --check backend/api/index.cjs

      - name: Install backend dependencies
        run: npm ci --prefix backend/api

      - name: Backend regression tests
        run: npm test

      - name: Install official DynamoDB Local (checksum verified)
        run: |
          mkdir -p "$RUNNER_TEMP/growpoint-dynamodb"
          cd "$RUNNER_TEMP/growpoint-dynamodb"
          curl -fsSL https://d1ni2b6xgvw0s0.cloudfront.net/v2.x/dynamodb_local_latest.tar.gz -o dynamodb_local_latest.tar.gz
          curl -fsSL https://d1ni2b6xgvw0s0.cloudfront.net/v2.x/dynamodb_local_latest.tar.gz.sha256 -o archive.sha256
          expected=$(awk '{print $1}' archive.sha256)
          echo "$expected  dynamodb_local_latest.tar.gz" | sha256sum --check
          tar -xzf dynamodb_local_latest.tar.gz

      - name: Billing transactions against DynamoDB Local (no AWS or bank access)
        run: npm run test:billing:local
        env:
          GP_DYNAMODB_LOCAL_JAR: ${{ runner.temp }}/growpoint-dynamodb/DynamoDBLocal.jar

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Validate (no backend / no credentials)
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate
